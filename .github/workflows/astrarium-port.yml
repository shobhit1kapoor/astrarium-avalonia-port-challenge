name: Astrarium port build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            rid: win-x64
            artifact: astrarium-windows-x64
          - label: Linux x64
            runner: ubuntu-24.04
            rid: linux-x64
            artifact: astrarium-linux-x64
          - label: macOS Intel
            runner: macos-15-intel
            rid: osx-x64
            artifact: astrarium-macos-x64
          - label: macOS Apple silicon
            runner: macos-15
            rid: osx-arm64
            artifact: astrarium-macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test the solution
        run: dotnet test Astrarium.Port.sln --configuration Release

      - name: Publish self-contained desktop build
        run: >-
          dotnet publish src/Astrarium.Avalonia/Astrarium.Avalonia.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish
          -p:PublishTrimmed=false
          -p:PublishSingleFile=false

      - name: Verify opened Avalonia window (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $marker = Join-Path $pwd "astrarium-window-opened.txt"
          $env:ASTRARIUM_WINDOW_SMOKE_FILE = $marker
          $process = Start-Process -FilePath "$pwd/publish/Astrarium.Avalonia.exe" -PassThru
          for ($attempt = 0; $attempt -lt 20 -and -not (Test-Path $marker); $attempt++) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
            if ($process.HasExited) { throw "Astrarium exited before its window opened." }
          }
          if (-not (Test-Path $marker)) { throw "Astrarium did not report its Avalonia window opening." }
          Stop-Process -Id $process.Id -Force

      - name: Verify opened Avalonia window (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export ASTRARIUM_WINDOW_SMOKE_FILE="$PWD/astrarium-window-opened.txt"
          ./publish/Astrarium.Avalonia &
          app_pid=$!
          for attempt in $(seq 1 20); do
            if [ -f "$ASTRARIUM_WINDOW_SMOKE_FILE" ]; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then wait "$app_pid"; exit 1; fi
            sleep 0.5
          done
          if [ ! -f "$ASTRARIUM_WINDOW_SMOKE_FILE" ]; then echo "Avalonia window did not open."; kill "$app_pid" 2>/dev/null || true; exit 1; fi
          kill "$app_pid"
          wait "$app_pid" || true

      - name: Verify opened Avalonia window (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          export ASTRARIUM_WINDOW_SMOKE_FILE="$PWD/astrarium-window-opened.txt"
          xvfb-run --auto-servernum bash -c '
            ./publish/Astrarium.Avalonia &
            app_pid=$!
            for attempt in $(seq 1 20); do
              if [ -f "$ASTRARIUM_WINDOW_SMOKE_FILE" ]; then break; fi
              if ! kill -0 "$app_pid" 2>/dev/null; then wait "$app_pid"; exit 1; fi
              sleep 0.5
            done
            if [ ! -f "$ASTRARIUM_WINDOW_SMOKE_FILE" ]; then echo "Avalonia window did not open."; kill "$app_pid" 2>/dev/null || true; exit 1; fi
            kill "$app_pid"
            wait "$app_pid" || true
          '

      - name: Package build with executable permissions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          tar -czf "artifacts/${{ matrix.artifact }}.tar.gz" -C publish .

      - name: Upload downloadable build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 30
